# Catálogo de versiones. Único sitio donde se fija una versión: los build.gradle.kts
# sólo referencian alias, así que subir una librería es editar una línea aquí.

[versions]
agp = "8.12.0"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
hilt = "2.57"
googleServices = "4.4.2"

coreKtx = "1.16.0"
lifecycle = "2.9.2"
activityCompose = "1.10.1"
composeBom = "2025.08.00"
navigationCompose = "2.9.3"
hiltNavigationCompose = "1.2.0"

room = "2.7.2"
workManager = "2.10.2"
hiltWork = "1.2.0"
datastore = "1.1.7"

camerax = "1.4.2"
playServicesLocation = "21.3.0"
playIntegrity = "1.4.0"
firebaseBom = "33.13.0"

retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.8.1"
retrofitSerialization = "1.0.0"
coroutines = "1.10.2"

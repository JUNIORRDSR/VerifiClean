# SDK fijo en vez de "el del targetSdk".
#
# Sin esto, Robolectric intentaría descargar el android-all de la API 36, que puede no
# estar publicada todavía para la versión de Robolectric que usamos, y los tests fallarían
# con un error de descarga que no tiene nada que ver con el código. La API 34 es estable,
# está publicada, y la lógica que se prueba aquí —Room y el worker— no depende de la
# versión de plataforma.
sdk=34
